[package]
name = "exaone-desktop"
version = "0.1.0"
description = "EXAONE 2.5 Desktop Workspace (Claude & Claude Code Benchmarked)"
authors = ["EXAONE Desktop"]
edition = "2021"

[lib]
name = "exaone_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
