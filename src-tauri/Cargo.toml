[package]
name = "any-lm-desktop"
version = "0.1.1"
description = "Desktop work app for local LLM servers (LM Studio, Ollama, OpenAI-compatible)"
authors = ["kidarigun"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "any_lm_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
base64 = "0.22"
trash = "5.3.0"
keyring = { version = "3.6", features = ["windows-native"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
tauri-plugin-updater = "2"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# 오른쪽 작업 패널의 터미널 (Windows ConPTY)
portable-pty = "0.9.0"

[target.'cfg(windows)'.dependencies]
# 터미널 프로세스 트리를 Job Object로 묶어 닫기·앱 종료 때 함께 끝낸다.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
# iframe이 Tauri 예약 호스트로 이동하지 못하게 WebView2 프레임 이벤트를 건다 (결정 0019). wry와 같은 버전.
webview2-com = "0.39.1"
windows-core = "0.62.2"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
